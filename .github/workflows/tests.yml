name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements-test.txt
      - name: Compile application
        run: python -m compileall -q main.py nexus tests backend
      - name: Smoke-test desktop UI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; from nexus.window import MainWindow; app = QApplication([]); window = MainWindow(); window.close(); print('NEXUS UI smoke test passed')"
      - name: Run tests
        run: python -m pytest -q
      - name: Run backend API tests
        run: python -m pytest -q backend/tests
